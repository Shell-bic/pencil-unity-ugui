use_when:
  - content switching is mutually exclusive
  - navigation implies view replacement

do_not_use_when:
  - panels coexist in the same persistent layout
  - switching changes local state only
  - sequence is step-driven rather than route-driven

routing_structure:
  context: "inferred_router_context"

  paths:
    - view_id: "inferred_source"
      target_view: "inferred_destination"
      trigger: "Btn_Action"
      transition_type: "replace_content" 
      persistent_regions_affected: "none"
