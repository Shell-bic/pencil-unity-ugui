# Data Binding Template
# Details how static or runtime dynamic content gets assigned into the visual nodes

data_bindings:
  data_owners:
    - binding_owner: "inferred_controller_name"
      binding_scope: "global | local | view | overlay | flow"
      # Do not assign binding ownership before runtime structure is inferred.
      responsibility: "Populates list data."

  mappings:
    - node_target: "Txt_Title"
      data_source: "static_localization_key"
      update_trigger: "on_enable"
