# Prefab Binding Template
# Represents the mapping between visual hierarchies, prefabs, and their controlling scripts based on inferred system roles.

binding_plan:
  prefabs:
    - name: "Group_ReusableCard"
      scope: "global"
      description: "A standard layout card used across multiple contexts."
    
  controllers:
    - owner_role: "inferred"
      possible_roles: 
        - "global_manager"
        - "state_controller"
        - "view_controller"
        - "flow_controller"
        - "overlay_controller"
      target_hierarchy: "Group_TargetStructure"
      responsibility: "Manage localized state swapping for the filter sidebar."

  event_bindings:
    - trigger: "Btn_Action"
      target_behavior: "ToggleFilterState"